<!DOCTYPE html>
<html>
    <head lang="en-US">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CollabSpace — Find Your Team</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <linK rel="stylesheet" href="../../styles/tailwind.css">
    </head>
    <body>
        <div class="min-h-screen bg-paper font-sans text-ink flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Decorative background element-->
            <div class="absolute inset-0 dot-grid opacity-50 pointer-events-none"></div>
            <div class="absolute -top-32 -left-24 w-[480px] h-[480px] rounded-full bg-coral blur-[80px] opacity-20 pointer-events-none"></div>
            <div class="absolute bottom-0 -right-24 w-[420px] h-[420px] rounded-full bg-sage blur-[80px] opacity-20 pointer-events-none"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[380px] rounded-full bg-coral blur-[90px] opacity-15 pointer-events-none"></div>

            <div class="w-full max-w-md relative z-10">
                <!-- HEADER -->
                <div class="text-center mb-10">
                    <a href="index.html" class="inline-flex items-center gap-2 mb-4 hover:opacity-80 transition">
                        <span class="font-sans text-xl font-semibold text-ink">StuCollab</span>
                    </a>
                    <h1 class=" font-serif text-5xl font-black mb-3 leading-tight">
                        Welcome <em class="italic text-coral">back</em>
                    </h1>
                    <p class="text-lg text-muted">Sign in to continue to your dashboard</p>
                </div>

                <!-- form -->
                <form class="space-y-5">
                    <div class="bg-white rounded-3xl shadow-lg border-2 border-edge p-8 hover:shadow-xl transition-shadow">
                        <!-- EMAIL ENTRY-->
                        <div class="mb-6">
                            <label for="email" class="block text-sm font-semibold text-gray-600 mb-2">
                                Email Address
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="w-full px-3 py-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="you@email.com"
                                autoComplete="email"
                                onChange={handleChange}
                            >
                            <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                        <!-- PASSWORD INPUT-->
                        <div class="mb-4">
                            <label for="password" class="block text-sm font-semibold text-gray-600 mb-2">
                                Password
                            </label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="w-full px-3 py-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="Enter your Password"
                                autoComplete="current-password"
                                onChange={handleChange}
                            >
                            <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                        <!-- REMEMBER ME & FORGET PASSWORD-->
                        <div class="flex items-center justify-between text-sm py-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="rounded w-4 h-4 border-2 border-edge text-coral focus:ring-coral focus:ring-offset-0" />
                                <span class="text-muted">Remember me</span>
                            </label>
                            <a href="forget-password.html" class="text-coral hover:underline font-medium">
                                Forgot password?
                            </a>
                        </div>
                        <!-- LOGIN BUTTON-->
                        <button
                            type="submit"
                            class="w-full font-semibold text-white bg-coral px-6 py-3.5 rounded-full shadow-[0_4px_20px_rgba(232,93,58,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_28px_rgba(232,93,58,0.4)] transition-all"
                            >
                            Sign in to your account
                        </button>
                        <!-- Demo credentials hint -->
                        <div class="mt-6 p-4 bg-cream rounded-2xl border border-edge">
                            <p class="text-xs text-muted text-center">
                            <strong class="text-ink">Demo:</strong> Use any email from mock users (e.g., sarah@university.edu)
                            </p>
                        </div>
                    </div>
                </form>
                <div class="mt-6 text-center text-sm text-muted">
                        Don't have an account?
                        <a href="signup.html" class="text-coral hover:underline font-semibold">
                        Create account
                        </a>
                </div>                    
                <!-- Back to home link -->
                <div class="text-center mt-8">
                    <a href="index.html" class="text-sm text-muted hover:text-ink transition inline-flex items-center gap-1">
                        ← Back to home
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
