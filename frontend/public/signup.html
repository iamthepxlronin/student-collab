<!DOCTYPE html>
<html>
    <head lang="en-US">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CollabSpace — Find Your Team</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <linK rel="stylesheet" href="../../styles/tailwind.css">
    </head>
    <body>
        <div class="font-sans min-h-screen bg-paper text-ink flex items-center justify-center p-4 py-12 relative overflow-hidden">
        <!-- Decorative background element-->
        <div class="absolute inset-0 dot-grid opacity-50 pointer-events-none"></div>
        <div class="absolute top-0 -right-32 w-[500px] h-[500px] rounded-full bg-amber blur-[80px] opacity-20 pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-32 w-[450px] h-[450px] rounded-full bg-sage blur-[80px] opacity-20 pointer-events-none"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[380px] rounded-full bg-coral blur-[90px] opacity-15 pointer-events-none"></div>

        <div class="w-full max-w-md relative z-10">
            <!-- HEADER -->
            <div class="text-center mb-10">
                <a href="" class="inline-flex items-center gap-2 mb-4 hover:opacity-80 transition">
                    <span class="font-sans text-xl font-semibold text-ink">StuCollab</span>
                </a>
                <h1 class="font-serif text-5xl font-black mb-3 leading-tight">
                    Join the <em class="italic text-sage">community</em>
                </h1>
                <p class="text-lg text-muted">Create your account and start collaborating</p>
            </div>

            <!-- FORM -->
            <div class="bg-white rounded-3xl shadow-lg border-2 border-edge p-8 hover:shadow-xl transition-shadow">
            <form onSubmit={handleSubmit} class="space-y-5">
                <!-- NAME -->
                <div class="mb-4">
                    <label for="Full Name" class="block text-sm text-gray-600 font-semibold mb-2">
                        Full Name
                    </label>
                    <input
                    type="text"
                    id="name"
                    name="fullName"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="Enter Your Full Name"
                    autoComplete="name"
                    onChange={handleChange}
                    >
                    <p id="nameError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <!-- EMAIL INPUT-->
                <div class="mb-4">
                    <label for="Email" class="block text-sm text-gray-600 font-semibold mb-2">
                        Email Address
                    </label>
                    <input
                    type="email"
                    id="email"
                    name="email"
                    class="w-full px-3 py-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="you@email.com"
                    onChange={handleChange}
                    autoComplete="email"
                    >
                    <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>
                
                <!-- PASSWORD -->
                <div class="mb-4">
                    <label for="Password" class="block text-sm text-gray-600 font-semibold mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            placeholder="At least 6 characters"
                            onChange={handleChange}
                            autoComplete="new-password"
                        >
                        <button
                            type="button"
                            id="passwordToggle"
                            onclick="togglePassword('password', 'passwordIcon')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
                        >
                        <i id="passwordIcon" class="fa-regular fa-eye-slash"></i>    
                        </button>
                    </div>
                    <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <!-- DEPARTMENT -->
                <div class="mb-4">
                    <label for="Department" class="block text-sm text-gray-600 font-semibold mb-2">
                        Department
                    </label>
                    <select
                        id="department"
                        name="department"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-white"
                        onChange={handleChange}
                    >
                        <option value="">Select your department</option>
                        <option value="computer-science">Computer Science</option>
                        <option value="cyber-security">Cyber Security</option>
                        <option value="information-technology">Information Technology</option>
                        <option value="software-engineering">Software Engineering</option>
                    </select>
                    <p id="departmentError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <div class="mb-4">
                    <label for="skills" class="block text-sm text-gray-600 font-semibold mb-2">
                        Your Skills
                    </label>
                    <input
                        type="skills"
                        id="skills"
                        name="skills"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Type a skill and press Enter"
                        onChange={handleChange}
                    >
                    <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <!-- SUBMIT -->
                <button
                type="submit"
                class="w-full font-semibold text-white bg-coral px-6 py-3.5 rounded-full shadow-[0_4px_20px_rgba(232,93,58,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_28px_rgba(232,93,58,0.4)] transition-all"
                >
                Create your account
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-muted">
                Already have an account?
                <a href="login.html" class="text-coral hover:underline font-semibold">
                Sign in
                </a>
            </div>
            </div>

            <!-- Back to home link -->
            <div class="text-center mt-8">
            <a href="index.html" class="text-sm text-muted hover:text-ink transition inline-flex items-center gap-1">
                ← Back to home
            </a>
            </div>
        </div>
        </div>
    </body>
</html>
