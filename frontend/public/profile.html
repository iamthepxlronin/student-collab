<!DOCTYPE html>
<html>
    <head lang="en-US">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CollabSpace — Find Your Team</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <linK rel="stylesheet" href="../../styles/tailwind.css">
    </head>
    <body>
        <div class="min-h-screen bg-paper font-sans text-ink flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Decorative background element-->
            <div class="absolute inset-0 dot-grid opacity-70 pointer-events-none"></div>
            <div class="absolute -top-32 -right-24 w-[520px] h-[520px] rounded-full bg-amber blur-[70px] opacity-25 pointer-events-none"></div>
            <div class="absolute bottom-0 -left-20 w-[380px] h-[380px] rounded-full bg-coral blur-[70px] opacity-25 pointer-events-none"></div>
            <div class="absolute bottom-24 right-20 w-[300px] h-[300px] rounded-full bg-sage blur-[70px] opacity-25 pointer-events-none"></div>
        
            <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <!-- Header -->
                <h1 class="font-serif text-4xl font-black mb-2">My <em class="italic text-coral">profile</em></h1>
                <p class="text-muted mb-8">Tell collaborators about yourself. Contact details are revealed only to people you accept.</p>
                <div class="bg-white rounded-3xl shadow-lg border-2 border-edge p-8 hover:shadow-xl transition-shadow">
                    <!-- full name-->
                    <div class="mb-6">
                        <label for="name" class="block text-sm font-semibold text-gray-600 mb-2">
                            Full name
                        </label>
                        <input
                            id="email"
                            class="w-full px-3 py-4 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            value=""
                        >
                        <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <!-- Department -->
                    <div class="mb-6">
                        <label for="deparment" class="block text-sm font-semibold text-gray-600 mb-2">
                            Department
                        </label>
                        <select
                            id="department"
                            class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-white"
                            value=""
                            >
                            <option value="">Select</option>
                            <option value="computer-science">Computer Science</option>
                            <option value="cyber-security">Cyber Security</option>
                            <option value="information-technology">Information Technology</option>
                            <option value="software-engineering">Software Engineering</option>
                        </select>
                        <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>

                    <!-- Bio -->
                    <div class="mb-6">
                        <label for="bio" class="block text-sm font-semibold text-gray-600 mb-2">
                            Bio
                        </label>
                        <textarea
                        class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-white"
                        value=""
                        placeholder="A short intro about you."
                        >
                        </textarea>
                    </div>

                    <!-- Skills -->
                    <div class="mb-6">
                        <label for="skills" class="block text-sm font-semibold text-gray-600 mb-2">
                            Skills
                        </label>
                        <input
                            id="skills"
                            class="w-full px-3 py-4 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            value=""
                        >   
                    </div>

                    <!-- EMAIL ENTRY-->
                    <div class="mb-6">
                        <label for="email" class="block text-sm font-semibold text-gray-600 mb-2">
                            Contact email (shown when accepted)
                        </label>
                        <input
                            id="email"
                            class="w-full px-3 py-4 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            value=""
                        >
                    </div>

                    <!-- Whatsapp number-->
                    <div class="mb-6">
                        <label for="email" class="block text-sm font-semibold text-gray-600 mb-2">
                            WhatsApp (optional)
                        </label>
                        <input
                            id="email"
                            class="w-full px-3 py-4 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            value=""
                        >
                    </div>

                    <!-- save BUTTON-->
                    <button
                        type="save"
                        class="w-full font-semibold text-white bg-coral px-6 py-3.5 rounded-full shadow-[0_4px_20px_rgba(232,93,58,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_28px_rgba(232,93,58,0.4)] transition-all"
                        >
                        Save profile
                    </button>
                </div>                
            </div>
        </div>
        <script src="./js/utils.js"></script>
    </body>
</html>
