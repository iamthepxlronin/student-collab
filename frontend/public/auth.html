<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>StuCollab — Sign in</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="../../styles/tailwind.css">
    </head>
    <body>
        <div class="font-sans min-h-screen bg-paper text-ink flex items-center justify-center p-4 py-12 relative overflow-hidden">
            <!-- Decorative background elements -->
            <div class="absolute inset-0 dot-grid opacity-50 pointer-events-none"></div>
            <div class="absolute top-0 -right-32 w-[500px] h-[500px] rounded-full bg-amber blur-[80px] opacity-20 pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-32 w-[450px] h-[450px] rounded-full bg-sage blur-[80px] opacity-20 pointer-events-none"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[380px] rounded-full bg-coral blur-[90px] opacity-15 pointer-events-none"></div>

            <div class="w-full max-w-md relative z-10">
                <!-- HEADER -->
                <div class="text-center mb-8">
                    <a href="index.html" class="inline-flex items-center gap-2 mb-6 hover:opacity-80 transition">
                        <span class="font-sans text-xl font-semibold text-ink">StuCollab</span>
                    </a>
                    <h1 class="font-serif text-5xl font-black mb-3 leading-tight" id="pageTitle">
                        Welcome <em class="italic text-coral">back</em>
                    </h1>
                    <p class="text-lg text-muted" id="pageSubtitle">
                        Sign in to continue to your dashboard
                    </p>
                </div>

                <!-- MAIN CARD -->
                <div class="bg-white rounded-3xl shadow-lg border-2 border-edge p-8 hover:shadow-xl transition-shadow">
                    <!-- TABS -->
                    <div class="flex flex-wrap justify-center gap-4 p-1 bg-cream rounded-full mb-4 py-1.5">
                        <div class="flex-1">
                            <a href="?mode=login" 
                            id="loginTab"
                            class="block w-full px-3 py-2 rounded-full text-sm font-semibold transition bg-white shadow-sm text-ink text-center">
                                Sign in
                            </a>
                        </div>
                        <div class="flex-1">
                            <a href="?mode=signup" 
                            id="signupTab"
                            class="block w-full px-3 py-2 rounded-full text-sm font-semibold transition text-muted text-center">
                                Sign up
                            </a>
                        </div>
                    </div>

                    <!-- LOGIN FORM -->
                    <form id="loginForm" class="space-y-4">
                        <!-- Email -->
                        <div class="mb-4">
                            <label for="loginEmail" class="block text-sm font-semibold text-gray-600 mb-2">
                                Email Address
                            </label>
                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition"
                                placeholder="you@email.com"
                                autocomplete="email"
                            >
                            <p id="loginEmailError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Password -->
                        <div>
                            <label for="loginPassword" class="block text-sm font-semibold text-gray-600 mb-2">
                                Password
                            </label>
                            <div class="relative">
                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition pr-12"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                >
                                <button
                                    type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                >
                                    <i class="fa-regular fa-eye-slash"></i>    
                                </button>
                            </div>
                            <p id="loginPasswordError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Remember me & Forgot password -->
                        <div class="flex items-center justify-between text-sm py-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="rounded w-4 h-4 border-2 border-edge text-coral focus:ring-coral focus:ring-offset-0" />
                                <span class="text-muted">Remember me</span>
                            </label>
                            <a href="forget-password.html" class="text-coral hover:underline font-medium">
                                Forgot password?
                            </a>
                        </div>

                        <!-- Submit -->
                        <button
                            type="submit"
                            class="w-full font-semibold text-white bg-coral px-6 py-3.5 rounded-full shadow-[0_4px_20px_rgba(232,93,58,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_28px_rgba(232,93,58,0.4)] transition-all"
                        >
                            Sign in to your account
                        </button>
                    </form>

                    <!-- SIGNUP FORM -->
                    <form id="signupForm" class="space-y-4 hidden ">
                        <!-- Full Name -->
                        <div class="mb-4">
                            <label for="signupName" class="block text-sm font-semibold text-gray-600 mb-2">
                                Full Name
                            </label>
                            <input
                                type="text"
                                id="signupName"
                                name="fullName"
                                class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition"
                                placeholder="Enter your full name"
                                autocomplete="name"
                            >
                            <p id="signupNameError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Email -->
                        <div class="mb-4">
                            <label for="signupEmail" class="block text-sm font-semibold text-gray-600 mb-2">
                                Email Address
                            </label>
                            <input
                                type="email"
                                id="signupEmail"
                                name="email"
                                class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition"
                                placeholder="you@email.com"
                                autocomplete="email"
                            >
                            <p id="signupEmailError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="signupPassword" class="block text-sm font-semibold text-gray-600 mb-2">
                                Password
                            </label>
                            <div class="relative">
                                <input
                                    type="password"
                                    id="signupPassword"
                                    name="password"
                                    class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition pr-12"
                                    placeholder="At least 6 characters"
                                    autocomplete="new-password"
                                >
                                <button
                                    type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                >
                                    <i class="fa-regular fa-eye-slash"></i>    
                                </button>
                            </div>
                            <p id="signupPasswordError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Department -->
                        <div class="mb-4">
                            <label for="signupDepartment" class="block text-sm font-semibold text-gray-600 mb-2">
                                Department
                            </label>
                            <select
                                id="signupDepartment"
                                name="department"
                                class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition"
                            >
                                <option value="">Select your department</option>
                                <option value="computer-science">Computer Science</option>
                                <option value="cyber-security">Cyber Security</option>
                                <option value="information-technology">Information Technology</option>
                                <option value="software-engineering">Software Engineering</option>
                            </select>
                            <p id="signupDepartmentError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Skills -->
                        <div class="mb-4">
                            <label for="signupSkills" class="block text-sm font-semibold text-gray-600 mb-2">
                                Your Skills
                            </label>
                            <input
                                type="text"
                                id="signupSkills"
                                name="skills"
                                class="w-full px-4 py-3 border-2 border-edge rounded-full bg-white focus:outline-none focus:border-coral transition"
                                placeholder="Type a skill and press Enter"
                            >
                            <p id="signupSkillsError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>

                        <!-- Submit -->
                        <button
                            type="submit"
                            class="w-full font-semibold text-white bg-coral px-6 py-3.5 rounded-full shadow-[0_4px_20px_rgba(232,93,58,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_28px_rgba(232,93,58,0.4)] transition-all"
                        >
                            Create your account
                        </button>
                    </form>

                    <!-- DIVIDER -->
                    <div class="mt-6 flex justify-center items-center gap-3">
                        <div class="h-px w-6 flex-1 border-edge border-t"></div>
                            <span class="text-xs text-muted font-medium">OR</span>
                        <div class="h-px w-6 flex-1 border-edge border-t"></div>
                    </div>

                    <!-- GOOGLE BUTTON 
                    <button type="button" class="w-full flex items-center justify-center gap-3 py-3 rounded-full border-2 border-edge bg-white hover:bg-cream font-semibold text-sm text-ink transition">
                        <svg class="w-5 h-5" >
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/>
                        </svg>
                        Continue with Google
                    </button>
                    -->
                    </div>
                    

                    <!-- FOOTER LINKS -->
                    <div class="mt-6 text-center text-sm text-muted" id="authFooter">
                        Don't have an account?
                        <a href="?mode=signup" class="text-coral hover:underline font-semibold" id="switchToSignup">
                            Create account
                        </a>
                    </div>

                    <div class="mt-8 text-center">
                        <a href="index.html" class="text-sm text-muted hover:text-ink transition inline-flex items-center gap-1">
                            ← Back to home
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <script src="./js/auth.js"></script>
    </body>
</html>
