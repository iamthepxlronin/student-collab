<!DOCTYPE html>
<html>
    <head lang="en-US">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CollabSpace — My Projects</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="styles/tailwind.css">
    </head>
    <body class="font-sans bg-paper text-ink overflow-x-hidden">

        <!-- OVERLAY -->
        <div id="sidebarOverlay"
             class="fixed inset-0 bg-ink opacity-0 pointer-events-none transition-opacity z-30">
        </div>

        <!-- SIDEBAR -->
        <aside id="sidebar"
               class="fixed left-0 top-0 h-screen w-72 border-r border-edge bg-white z-40
                      -translate-x-full transition-transform duration-300">
        </aside>

        <!-- TOP NAVBAR -->
        <nav class="fixed top-0 left-0 right-0 h-14 bg-white border-b border-edge z-20
                    flex items-center px-4 gap-4">
            <button id="sidebarToggle" class="text-ink hover:text-coral transition p-1">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <a href="dashboard.html" class="font-serif font-black text-lg">
                Collab<span class="text-coral">Space</span>
            </a>
        </nav>

        <div class="min-h-screen bg-paper relative overflow-hidden">
            <!-- Decorative background elements -->
            <div class="absolute inset-0 dot-grid opacity-50 pointer-events-none"></div>
            <div class="absolute -top-32 -left-24 w-[480px] h-[480px] rounded-full bg-coral blur-[80px] opacity-20 pointer-events-none"></div>
            <div class="absolute bottom-0 -right-24 w-[420px] h-[420px] rounded-full bg-sage blur-[80px] opacity-20 pointer-events-none"></div>

            <div class="pt-14 relative z-10">
                <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

                    <!-- Header -->
                    <div class="flex items-center justify-between mb-8 flex-wrap gap-3">
                        <div>
                            <h1 class="font-serif text-4xl font-black">My <em class="italic text-coral">projects</em></h1>
                            <p class="text-muted mt-1">Manage projects you've posted.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <!-- Post Count Badge -->
                            <span class="bg-white border-2 border-edge rounded-full px-4 py-2.5 text-sm font-semibold text-ink">
                                <span id="postCount">0</span> projects
                            </span>
                            <a href="create-post.html"
                            class="inline-flex items-center gap-2 font-semibold text-white bg-coral px-5 py-2.5 rounded-full hover:-translate-y-0.5 transition">
                                <i class="fa-solid fa-plus"></i>
                                New project
                            </a>
                        </div>
                    </div>

                    <!-- Loading state -->
                    <div id="loadingState" class="text-center py-20">
                        <p class="text-muted">Loading your projects...</p>
                    </div>

                    <!-- Empty state — shown by JS if user has no posts -->
                    <div id="emptyState" class="hidden bg-white border-2 border-dashed border-edge rounded-3xl py-16 text-center">
                        <p class="text-muted mb-4">You haven't posted anything yet.</p>
                        <a href="create-post.html" class="font-semibold text-coral hover:underline">
                            Post your first project →
                        </a>
                    </div>

                    <!-- Posts grid — populated by JS -->
                    <div id="myPostsGrid" class="grid md:grid-cols-2 gap-5"></div>

                </div>
            </div>
        </div>

        <script src="./js/utils.js"></script>
        <script src="./js/my-posts.js"></script>
    </body>
</html>
