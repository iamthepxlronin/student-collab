<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CollabSpace — Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="../../styles/tailwind.css">
    </head>
    <body class="font-sans bg-paper text-ink overflow-x-hidden">

        <!-- OVERLAY -->
        <div id="sidebarOverlay"
             class="fixed inset-0 bg-ink opacity-0 pointer-events-none transition-opacity z-30">
        </div>

        <!-- SIDEBAR -->
        <aside id="sidebar"
               class="fixed left-0 top-0 h-screen w-72 border-r border-edge bg-white z-40
                      -translate-x-full transition-transform duration-300">
        </aside>

        <!-- TOP NAVBAR -->
        <nav class="fixed top-0 left-0 right-0 h-14 bg-white border-b border-edge z-20
                    flex items-center px-4 gap-4">
            <button id="sidebarToggle" class="text-ink hover:text-coral transition p-1">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <a href="dashboard.html" class="font-serif font-black text-lg">
                Collab<span class="text-coral">Space</span>
            </a>
        </nav>

        <div class="min-h-screen bg-paper relative overflow-hidden">
            <!-- Decorative background elements -->
            <div class="absolute inset-0 dot-grid opacity-40 pointer-events-none"></div>
            <div class="absolute bottom-32 right-24 w-[520px] h-[520px] rounded-full bg-amber blur-[70px] opacity-25 pointer-events-none"></div>
            <div class="absolute bottom-0 -left-20 w-[380px] h-[380px] rounded-full bg-coral blur-[70px] opacity-25 pointer-events-none"></div>
            <div class="absolute top-20 right-20 w-[300px] h-[300px] rounded-full bg-sage blur-[70px] opacity-20 pointer-events-none"></div>

            <div class="pt-14 relative z-10">
                <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

                    <!-- WELCOME SECTION -->
                    <div class="mb-10">
                        <p class="text-muted text-sm font-medium mb-1">Good to see you,</p>
                        <h1 class="font-serif text-5xl font-black leading-tight mb-2">
                            <span id="welcomeName">...</span>
                        </h1>
                        <p class="text-muted text-lg">Here's what's happening with your projects.</p>
                    </div>

                    <!-- STATS CARDS -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-10">
                        <div class="bg-white rounded-3xl border-2 border-edge p-6 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex items-center justify-between mb-4">
                                <p class="text-sm font-semibold text-muted">Projects Posted</p>
                                <div class="w-10 h-10 rounded-2xl bg-coral/10 flex items-center justify-center">
                                    <i class="fa-solid fa-folder text-coral"></i>
                                </div>
                            </div>
                            <p class="font-serif text-4xl font-black text-ink" id="statPostsCount">0</p>
                        </div>

                        <div class="bg-white rounded-3xl border-2 border-edge p-6 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex items-center justify-between mb-4">
                                <p class="text-sm font-semibold text-muted">Applications Sent</p>
                                <div class="w-10 h-10 rounded-2xl bg-sage/10 flex items-center justify-center">
                                    <i class="fa-solid fa-paper-plane text-sage"></i>
                                </div>
                            </div>
                            <p class="font-serif text-4xl font-black text-ink" id="statAppsCount">0</p>
                        </div>

                        <div class="bg-white rounded-3xl border-2 border-edge p-6 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex items-center justify-between mb-4">
                                <p class="text-sm font-semibold text-muted">Pending Applications</p>
                                <div class="w-10 h-10 rounded-2xl bg-amber/10 flex items-center justify-center">
                                    <i class="fa-solid fa-clock text-amber"></i>
                                </div>
                            </div>
                            <p class="font-serif text-4xl font-black text-ink" id="statPendingCount">0</p>
                        </div>
                    </div>

                    <!-- RECENT ACTIVITY -->
                    <div class="grid lg:grid-cols-2 gap-8">

                        <!-- Recent Posts -->
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="font-serif text-2xl font-bold">Recent <em class="italic text-coral">projects</em></h2>
                                <a href="my-posts.html" class="text-sm text-coral font-semibold hover:underline">
                                    View all →
                                </a>
                            </div>
                            <div id="recentPosts" class="space-y-3">
                                <p class="text-muted text-sm">Loading...</p>
                            </div>
                        </div>

                        <!-- Recent Applications -->
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="font-serif text-2xl font-bold">Recent <em class="italic text-sage">applications</em></h2>
                                <a href="applications.html" class="text-sm text-coral font-semibold hover:underline">
                                    View all →
                                </a>
                            </div>
                            <div id="recentApplications" class="space-y-3">
                                <p class="text-muted text-sm">Loading...</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <script src="./js/utils.js"></script>
        <script src="./js/dashboard.js"></script>
    </body>
</html>
