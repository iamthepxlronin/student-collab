<!DOCTYPE html>
<html>
    <head lang="en-US">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CollabSpace — Find Your Team</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <linK rel="stylesheet" href="../../styles/tailwind.css">
    </head>
    <body>
        <div class="min-h-screen bg-paper font-sans text-ink flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Decorative background element-->
            <div class="absolute inset-0 dot-grid opacity-40 pointer-events-none"></div>
            <div class="absolute -top-40 -right-40 w-[600px] h-[600px] rounded-full bg-coral blur-[120px] opacity-20 pointer-events-none"></div>
            <div class="absolute -bottom-40 -left-40 w-[600px] h-[600px] rounded-full bg-sage blur-[120px] opacity-20 pointer-events-none"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[380px] rounded-full bg-coral blur-[90px] opacity-15 pointer-events-none"></div>


            <div class="w-full max-w-md relative z-10 px-6">
                <!-- HEADER -->
                <div class="text-center mb-10">
                    <a href="index.html" class="inline-flex items-center gap-2 mb-8 hover:opacity-80 transition">
                        <span class="font-sans text-xl font-semibold text-ink">StuCollab</span>
                    </a>
                    <h1 class=" font-serif text-4xl font-black mb-3 leading-tight">
                        Forgot your <em class="italic text-coral">Password?</em>
                    </h1>
                    <p class="text- text-muted">No worries, we'll send you reset instructions</p>
                </div>
                <!-- Back to home link -->
                <div class="text-center mt-6 mb-4">
                    <a href="index.html" class="text-sm text-muted hover:text-ink transition inline-flex items-center gap-1">
                        ← Back to home
                    </a>
                </div>
                <!-- form -->
                <form class="space-y-5">
                    <div class="bg-white rounded-3xl shadow-lg border-2 border-edge p-8 hover:shadow-xl transition-shadow">
                        <!-- EMAIL ENTRY-->
                        <div class="mb-6">
                            <label for="email" class="block text-sm text-gray-600 font-semibold mb-2">
                                Email address
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="w-full px-3 py-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="you@email.com"
                                autoComplete="email"
                                onChange={handleChange}
                            >
                            <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                        <!-- SEND BUTTON-->
                        <button
                            type="submit"
                            class="w-full font-semibold text-white bg-coral px-6 py-3.5 rounded-2xl shadow-[0_4px_20px_rgba(232,93,58,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_28px_rgba(232,93,58,0.4)] transition-all"
                            >
                            Send Code
                        </button>
                    </div>
                </form>
                <!-- Login Link -->>
                <div class="mt-6 text-center">
                <p class="text-muted">
                    Remember your password?
                    <a href="login.html" class="text-coral font-semibold hover:underline transition">
                    Sign in
                    </a>
                </p>
                </div>
                
            </div>
        </div>
    </body>
</html>
